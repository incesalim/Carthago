name: Refresh audit reports

# Bank audit-report acquisition + extraction. During quarterly earnings windows
# this checks every day and immediately carries each valid new filing through to
# D1. Manual dispatch remains available for targeted repairs from /admin.
#
# Decoupled by design:
#   - Own staging DB:        data/bank_audit.db (NOT the shared bddk_data.db)
#   - Own R2 snapshot:       state/bank_audit.db.gz
#   - Own concurrency group: bddk-audit (NOT bddk-pipeline)
# So it runs in parallel with the bulletin/EVDS workflows and a flaky PDF
# extraction or a rotated IR URL can never delay or fail the monthly/weekly
# D1 push. The only shared sink is D1 itself, where it writes a disjoint set
# of tables (bank_audit_*) with idempotent INSERT OR REPLACE.
#
# When to run:
#   - Daily in the filing windows: late Jan/Apr/Jul/Oct through the following
#     reporting-deadline month (plus early March for annual consolidated reports).
#   - Manually from the /admin panel or Actions for targeted repairs.
on:
  schedule:
    - cron: "0 4 20-31 1,4,7,10 *"
    - cron: "0 4 1-29 2 *"
    - cron: "0 4 1-20 5,8,11 *"
    - cron: "0 4 1-15 3 *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip scraping new PDFs (extract-only)"
        type: boolean
        default: false
      bank:
        description: "Restrict to one or more tickers (comma-separated, e.g. AKBNK). Blank = all banks."
        type: string
        default: ""
      period:
        description: "Re-extract a single quarter, e.g. 2024Q4 (forces re-extraction of the existing R2 PDF; pair with bank)."
        type: string
        default: ""
      dry_run:
        description: "Preview one bank/quarter from existing PDFs; no D1, R2, or notification writes"
        type: boolean
        default: false

# Read-only on git — the audit snapshot lives in R2, not git.
permissions:
  contents: read

# Separate lane from bddk-pipeline: audit shares no R2 snapshot with the
# bulletin/EVDS workflows, so it can run concurrently with them.
concurrency:
  group: bddk-audit
  cancel-in-progress: false

jobs:
  refresh:
    name: Audit reports → SQLite → D1
    runs-on: ubuntu-latest
    # Generous: a from-scratch extraction of every PDF (if the snapshot were
    # ever lost) is the worst case. The first-run bootstrap below avoids that
    # by seeding from the bulletin snapshot instead.
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate dry-run scope
        if: inputs.dry_run
        env:
          BANK: ${{ inputs.bank }}
          PERIOD: ${{ inputs.period }}
          SKIP_SCRAPE: ${{ inputs.skip_scrape }}
        run: |
          [[ "$BANK" =~ ^[A-Z0-9]+$ && "$PERIOD" =~ ^[0-9]{4}Q[1-4]$ && "$SKIP_SCRAPE" == true ]] || {
            echo 'Dry-run requires one bank, one quarter, and skip_scrape=true.'
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch audit snapshot from R2 (bootstrap from bulletin snapshot on first run)
        run: |
          python - <<'PY'
          import gzip, shutil, pathlib, subprocess, sys
          from src.audit_reports import r2_storage
          gz = pathlib.Path("data/bank_audit.db.gz")
          db = pathlib.Path("data/bank_audit.db")
          gz.parent.mkdir(parents=True, exist_ok=True)
          if r2_storage.exists("state/bank_audit.db.gz"):
              size = r2_storage.download_to("state/bank_audit.db.gz", gz)
              print(f"Pulled state/bank_audit.db.gz from R2 ({size/1e6:.1f} MB)")
              with gzip.open(gz, "rb") as s, open(db, "wb") as d:
                  shutil.copyfileobj(s, d)
              print(f"Decompressed to {db.stat().st_size/1e6:.1f} MB")
          elif r2_storage.exists("state/bddk_data.db.gz"):
              # First run: no standalone audit snapshot yet. Seed bank_audit.db
              # from the bulletin snapshot's bank_audit_* tables so we don't
              # re-extract every PDF from scratch.
              print("No audit snapshot yet — bootstrapping from state/bddk_data.db.gz")
              bgz = pathlib.Path("data/bddk_data.db.gz")
              bdb = pathlib.Path("data/bddk_data.db")
              r2_storage.download_to("state/bddk_data.db.gz", bgz)
              with gzip.open(bgz, "rb") as s, open(bdb, "wb") as d:
                  shutil.copyfileobj(s, d)
              subprocess.run(
                  [sys.executable, "scripts/seed_audit_db.py",
                   "--from", str(bdb), "--to", str(db)],
                  check=True,
              )
          else:
              print("No snapshot in R2 at all — starting from empty audit DB. "
                    "sync_audit_reports will extract every PDF found in R2.")
          PY

      - name: Preserve dry-run comparison snapshot
        if: inputs.dry_run
        run: cp data/bank_audit.db data/bank_audit.before.db

      - name: Sync audit reports (scrape new PDFs → R2 → extract → audit DB)
        id: sync
        # Idempotent: skips PDFs already in R2 and (ticker,period,kind) already
        # extracted with success=1. Writes to the standalone data/bank_audit.db.
        env:
          NO_SCRAPE: ${{ inputs.skip_scrape && '--no-scrape' || '' }}
          # Forwarded via env (never interpolated into the command line) so an
          # arbitrary dispatch input is passed as one quoted argument and can't
          # inject shell. Blank on the schedule → full all-banks run.
          BANK: ${{ inputs.bank }}
          # A per-bank trigger means "grab this bank's freshly published quarter",
          # so restrict to its latest period. All-banks / scheduled runs stay full.
          LATEST: ${{ inputs.bank && '--latest-period' || '' }}
          # Forwarded via env (never interpolated) so the dispatch input is one
          # quoted argument and can't inject shell. Validated YYYYQn by the route.
          PERIOD: ${{ inputs.period }}
        run: |
          args=(--db data/bank_audit.db --workers 16)
          [ -n "$BANK" ] && args+=(--only-bank "$BANK")
          if [ -n "$PERIOD" ]; then
            # Targeted re-extract: re-run one quarter from its existing R2 PDF
            # (force overrides the already-done skip; no scrape needed).
            args+=(--periods "$PERIOD" --force --no-scrape)
          else
            [ -n "$NO_SCRAPE" ] && args+=("$NO_SCRAPE")
            [ -n "$LATEST" ] && args+=("$LATEST")
          fi
          # Exit 8 is the systemic-failure ALARM, raised after extraction has
          # already written the local DB. Swallow it here and re-raise at the end
          # of the job (see "Fail the job if the sync raised a systemic alarm"),
          # so the snapshot upload and the D1 push still run. Failing here is
          # what discarded six days of good extraction over four dead bank URLs
          # (2026-08-08 → 08-12). Any OTHER nonzero code is a real crash and
          # still fails the step immediately, because a crashed sync must not
          # have its half-written DB pushed anywhere.
          set +e
          python scripts/sync_audit_reports.py "${args[@]}" \
            --result-file sync_result.json
          rc=$?
          set -e
          if [ "$rc" -eq 8 ]; then
            echo "::warning::sync raised a systemic-failure alarm (exit 8) — persisting this run's work, then failing the job at the end"
            echo "systemic=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          python - <<'PY'
          import json, os
          result = json.load(open("sync_result.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={str(result['changed']).lower()}\n")
              out.write(f"new={result.get('scrape', {}).get('new', 0)}\n")
              out.write(f"extracted={result.get('extract', {}).get('ok', 0)}\n")
          print(f"handoff: changed={result['changed']} "
                f"new={result.get('scrape', {}).get('new', 0)} "
                f"extracted={result.get('extract', {}).get('ok', 0)}")
          # A bank whose IR page refused us is indistinguishable, in every count
          # above, from a bank that has not filed. Discovery is fail-safe by
          # design and must stay that way, so the failure is raised here as a
          # job warning instead: visible on the run, silent in Telegram (a
          # geo-blocked host fails every single day — see DISCOVERY_FAILURES).
          for f in result.get("discovery_failures", []):
              print(f"::warning title=Discovery fell back to static config::"
                    f"{f['bank']}: {f['reason']}")
          PY

      - name: Rebuild bank_audit_stages from credit-quality
        if: steps.sync.outputs.changed == 'true'
        # Derived table the dashboard's Stage 1/2/3 view reads. Rebuild from the
        # standalone audit DB so push_to_d1 has fresh stage rows to send.
        run: python scripts/build_bank_audit_stages.py --db data/bank_audit.db

      - name: Revalidate all partitions (recompute bank_audit_validation)
        if: steps.sync.outputs.changed == 'true'
        # Cheap pure-stored-row recompute so the coverage matrix + /banks badges
        # reflect the CURRENT validator across the whole corpus, not just freshly
        # re-extracted banks. Only a partition whose VERDICT moved is rewritten:
        # validated_at is what the push below windows on, so re-stamping an
        # unchanged verdict re-ships it to D1 — 19,950 validation rows and 9,439
        # pl_roles rows per no-op run, measured on the real snapshot.
        run: python scripts/revalidate_audit_db.py --db data/bank_audit.db

      - name: Rebuild coverage spine locally
        if: steps.sync.outputs.changed == 'true'
        # Batch the coverage changes with the extracted rows. The single D1 push
        # below owns the entire audit result; a quiet discovery run reaches none
        # of these steps.
        run: python scripts/sync_audit_expected.py --db data/bank_audit.db

      - name: Review dry-run financial changes
        if: inputs.dry_run
        env:
          BANK: ${{ inputs.bank }}
          PERIOD: ${{ inputs.period }}
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from src.audit_reports.units import MONEY_COLUMNS
          old = sqlite3.connect('data/bank_audit.before.db')
          new = sqlite3.connect('data/bank_audit.db')
          bank, period = os.environ['BANK'], os.environ['PERIOD']
          for kind in ('consolidated', 'unconsolidated'):
              key = (bank, period, kind)
              unit_sql = 'SELECT source_unit FROM bank_audit_extractions WHERE bank_ticker=? AND period=? AND kind=?'
              print('UNIT', key, old.execute(unit_sql, key).fetchone(), '->', new.execute(unit_sql, key).fetchone())
              for table, money in MONEY_COLUMNS.items():
                  cols = [r[1] for r in old.execute(f'PRAGMA table_info({table})')]
                  if not cols:
                      continue
                  cols = [c for c in cols if c not in {'extracted_at', 'validated_at'}]
                  query = f"SELECT {','.join(cols)} FROM {table} WHERE bank_ticker=? AND period=? AND kind=?"
                  before = sorted(old.execute(query, key).fetchall(), key=repr)
                  after = sorted(new.execute(query, key).fetchall(), key=repr)
                  if before != after:
                      scale = all(tuple(v * 1000 if c in money and v is not None else v for c, v in zip(cols, a)) == b
                                  for a, b in zip(before, after)) if len(before) == len(after) else False
                      print('CHANGED', key, table, 'rows', len(before), '->', len(after), 'exact_1000x', scale)
              print('BS_TOTALS', key, new.execute('SELECT statement,MAX(amount_total) FROM bank_audit_balance_sheet WHERE bank_ticker=? AND period=? AND kind=? GROUP BY statement', key).fetchall())
              failures = new.execute('SELECT statement,failed_detail FROM bank_audit_validation WHERE bank_ticker=? AND period=? AND kind=? AND checks_failed>0', key).fetchall()
              print('FAILURES', key, json.dumps(failures, ensure_ascii=False))
          PY

      - name: Capture this run's filings + reconcile stored vs printed (alert-only)
        if: steps.sync.outputs.changed == 'true' && !inputs.dry_run
        # Full-document capture of every filing extracted in the push window:
        # rows, columns, cells and notes into a RUN-LOCAL ledger, plus the
        # compact bank_audit_document_manifest into the audit DB — the single
        # D1 push below carries the manifest, and the snapshot upload carries it
        # forward. Then the reconcile checks the freshly stored figures against
        # the cells the filing actually printed, at the scale its own unit
        # declaration implies. That is the external anchor working the same day
        # a filing lands instead of at the next manual fleet backfill — the TEB
        # 2026Q2 failure (declared Milyon, ingested ×1, every internal identity
        # green) is visible to this and to nothing inside the filing.
        #
        # Non-blocking by construction: the run-local ledger is scratch (the
        # durable fleet ledger is R2's, built by backfill-document-capture.yml),
        # the reconcile is --alert (always exits 0), and a capture crash must
        # not take down a run whose extraction is already written — failing on
        # a side lane is what once discarded six days of good extraction.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set +e
          python scripts/backfill_document_capture.py --from-r2 --recent-hours 168 \
            --capture-db data/capture_run.db --no-jsonl
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::document capture failed (exit $rc) — extraction is unaffected; this run's manifest rows and reconcile are skipped"
          elif [ -f data/capture_run.db ]; then
            python scripts/check_capture_reconcile.py \
              --capture-db data/capture_run.db --audit-db data/bank_audit.db --alert
          fi

      - name: Cross-period unit watch (alert-only)
        if: steps.sync.outputs.changed == 'true' && !inputs.dry_run
        # The ONLY check in this pipeline that can see a reporting-unit error.
        # Every validator the audit lane runs argues INSIDE one filing —
        # TL+FC=Total, parent=Σchildren, closing=opening+flows — and a uniform
        # change of denomination scales both sides of each, so all of them foot
        # while every stored figure is wrong by 1000x. It has happened twice:
        # TEB 2026Q2, caught by hand, and ANADOLU 2026Q2, which sat live for
        # days because this comparison existed only in a MANUAL workflow and
        # nobody ran it. Hence: here, daily, beside the extraction that creates
        # the risk.
        #
        # Alert-only by construction — it opens no PDF, writes no row, touches
        # neither D1 nor R2, and exits 0 under --alert even with no snapshot, so
        # it can never take down a run whose data is already written.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/watch_cross_period.py --db data/bank_audit.db --alert

      - name: Audit data-quality check (alert-only)
        if: steps.sync.outputs.changed == 'true' && !inputs.dry_run
        # Flags silent extraction errors — a quarter whose lines are identical to
        # the prior one (period-shift, the Eximbank fingerprint), a balance sheet
        # that doesn't balance, or missing rows — and pings Telegram/Discord.
        # Never blocks the pipeline (exits 0); it's informational.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/check_audit_quality.py --db data/bank_audit.db --alert

      - name: Setup Node (for wrangler)
        if: steps.sync.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Push the complete audit batch to Cloudflare D1 once
        if: steps.sync.outputs.changed == 'true' && !inputs.dry_run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # 168h window — a new quarter's reports trickle in over weeks, so a wide
        # window is harmless (INSERT OR REPLACE is idempotent).
        # --table-set audit-refresh is every registry-derived bank_audit_* table
        # plus the three locally rebuilt coverage-spine tables.
        #
        # NEVER hand-list these tables again. The literal that used to live here
        # named 14 of the 16: bank_audit_fx_position and bank_audit_repricing were
        # extracted, validated and snapshotted every run, and silently never
        # reached D1 — /market-risk went stale for weeks while every other audit
        # page advanced, and the push exited 0 the whole time.
        #
        # --skip-unchanged-partitions is safe HERE and only here among the audit
        # paths: this lane calls push_to_d1 directly, with nothing clearing D1
        # first, so the push owns each partition end to end (its own scoped
        # DELETE + the current rows, in one wrangler file). The clear-then-push
        # callers (apply_overrides, load_partition, reextract_pl,
        # push_from_scratch, audit_d1.clear_d1_partitions) must NOT pass it — a
        # skip after their clear would leave the partition empty.
        run: >
          python scripts/push_to_d1.py --db data/bank_audit.db --hours 168
          --table-set audit-refresh --skip-unchanged-partitions

      - name: Upload audit snapshot back to R2
        if: steps.sync.outputs.changed == 'true' && !inputs.dry_run
        # Package only after the single D1 call succeeds, so the durable snapshot
        # includes both the new rows and push_to_d1's confirmed digest/row state.
        run: |
          python - <<'PY'
          import gzip, shutil, sqlite3, pathlib
          from src.audit_reports import r2_storage
          db = pathlib.Path("data/bank_audit.db")
          # VACUUM keeps the snapshot tight before compressing.
          with sqlite3.connect(str(db)) as c:
              c.execute("VACUUM")
          gz = pathlib.Path("data/bank_audit.db.gz")
          with open(db, "rb") as s, gzip.open(gz, "wb", compresslevel=6) as d:
              shutil.copyfileobj(s, d)
          size = r2_storage.upload_file(gz, "state/bank_audit.db.gz")
          print(f"Uploaded {size/1e6:.1f} MB to R2 state/bank_audit.db.gz")
          # Dated backup so a bad run can't destroy the only copy (keep last 7).
          from datetime import datetime, timezone
          date_str = datetime.now(timezone.utc).strftime("%Y%m%d")
          hkey = r2_storage.upload_history(gz, "bank_audit", date_str, keep=7)
          print(f"Backup → {hkey} (history pruned to last 7)")
          PY

      - name: Notify on newly acquired reports
        if: steps.sync.outputs.new != '0' && success() && !inputs.dry_run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: >
          python scripts/notify.py
          "🆕 audit refresh: ${{ steps.sync.outputs.new }} new PDF(s) acquired;
          ${{ steps.sync.outputs.extracted }} partition(s) extracted and saved."

      # LAST, deliberately. The alarm is raised by the sync step but re-raised
      # here, after the D1 push and the snapshot upload, so a scrape problem
      # reports loudly WITHOUT discarding the extraction it did not affect.
      # Placed above "Alert on failure" so that step still fires for it.
      - name: Fail the job if the sync raised a systemic alarm
        if: steps.sync.outputs.systemic == 'true'
        run: |
          echo "The sync reported a systemic failure (see its log for the ratio)."
          echo "This run's extraction, D1 push and snapshot upload have already"
          echo "completed — only the alarm is outstanding. Investigate the"
          echo "failing targets; nothing was lost."
          exit 1

      - name: Alert on failure
        if: failure() && !inputs.dry_run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/notify.py "❌ ${{ github.workflow }} failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
