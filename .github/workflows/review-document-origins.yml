name: Review official audit document origins

on:
  workflow_dispatch:
    inputs:
      banks:
        description: "ALL or comma-separated registered banks"
        type: string
        default: "ALL"
      period:
        description: "One YYYYQn; blank = all registered periods"
        type: string
        default: ""
      kind:
        description: "Filing basis"
        type: choice
        options: [BOTH, consolidated, unconsolidated]
        default: BOTH
      limit:
        description: "Maximum filings after filters; 0 = all"
        type: number
        default: 0
      publish:
        description: "Retain official transport, PDF and comparison evidence in private R2; never replace acquired PDFs"
        type: boolean
        default: false
      origin_source:
        description: "Registered bank URL, or an exact filing row in the regulator listing"
        type: choice
        options: [registered, bddk]
        default: registered

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'audit-document-origin-reviews' || format('audit-origin-probe-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  review:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON((inputs.banks == 'ALL' && inputs.limit == 0) && '[0,1,2,3]' || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare fresh official downloads with acquired bytes
        env:
          BANKS: ${{ inputs.banks }}
          PERIOD: ${{ inputs.period }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit }}
          PUBLISH: ${{ inputs.publish }}
          ORIGIN_SOURCE: ${{ inputs.origin_source }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          args=(--limit "$LIMIT" --shard-count "$SHARD_COUNT" --shard-index "$SHARD_INDEX" --source "$ORIGIN_SOURCE")
          [ "$BANKS" != "ALL" ] && args+=(--bank "$BANKS")
          [ -n "$PERIOD" ] && args+=(--period "$PERIOD")
          [ "$KIND" != "BOTH" ] && args+=(--kind "$KIND")
          [ "$PUBLISH" = "true" ] && args+=(--publish)
          python scripts/review_document_origins.py "${args[@]}"
      - name: Keep every named comparison, including differences and unavailable sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-document-origin-report-${{ matrix.shard }}
          path: data/audit_capture/origins-v1/origin-results.json
          retention-days: 30
      - name: Keep fresh source bytes for bounded read-only probes
        if: always() && !inputs.publish && inputs.limit > 0 && inputs.limit <= 4
        uses: actions/upload-artifact@v7
        with:
          name: audit-document-origin-evidence
          path: data/audit_capture/origins-v1/sources/
          retention-days: 7
