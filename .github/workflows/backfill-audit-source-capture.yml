name: Backfill audit source capture

# Manual, read-only-with-respect-to-facts completeness backfill. It downloads
# existing PDFs, preserves the physical source lines for the eight normalized/
# summary lanes, revalidates touched partitions, pushes only the compact manifest
# + changed validation rows, and uploads the enlarged local snapshot.
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "ALL or comma-separated lanes (equity_change, capital, ...)"
        type: string
        default: "ALL"
      banks:
        description: "ALL or comma-separated tickers"
        type: string
        default: "ALL"
      periods:
        description: "Comma-separated YYYYQn; blank = all"
        type: string
        default: ""
      kind:
        description: "consolidated/unconsolidated; blank = both"
        type: string
        default: ""
      limit:
        description: "Maximum PDFs after filters; 0 = all"
        type: number
        default: 0
      refresh_existing:
        description: "Recompute existing manifests too (unchanged rows are not re-stamped)"
        type: boolean
        default: false
      only_failing:
        description: "Only existing failed capture checks; no financial re-extraction"
        type: boolean
        default: false
      dry_run:
        description: "Build only in the runner's local DB; no D1/R2 writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bddk-audit
  cancel-in-progress: false

jobs:
  capture:
    name: Source evidence -> validation + D1 manifest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Node (wrangler)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Capture source evidence
        env:
          LANES: ${{ inputs.lanes }}
          BANKS: ${{ inputs.banks }}
          PERIODS: ${{ inputs.periods }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit }}
          REFRESH: ${{ inputs.refresh_existing && '--refresh-existing' || '' }}
          ONLY_FAILING: ${{ inputs.only_failing && '--only-failing' || '' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          args=(--lanes "$LANES" --banks "$BANKS" --limit "$LIMIT")
          [ -n "$PERIODS" ] && args+=(--periods "$PERIODS")
          [ -n "$KIND" ] && args+=(--kind "$KIND")
          [ -n "$REFRESH" ] && args+=("$REFRESH")
          [ -n "$ONLY_FAILING" ] && args+=("$ONLY_FAILING")
          [ -n "$DRY" ] && args+=("$DRY")
          python scripts/backfill_audit_source_capture.py "${args[@]}"

      - name: Refresh coverage matrix
        if: ${{ !inputs.dry_run }}
        run: python scripts/sync_audit_expected.py --push --save-snapshot

      - name: Audit data-quality check (alert-only)
        if: ${{ !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/check_audit_quality.py --db data/bank_audit.db --alert
