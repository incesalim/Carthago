name: Test OpenRouter key (scratch)

# Manual probe for the OPEN_ROUTER_API secret. Secrets are CI-only (never
# local), so this is the only way to test the key.
#
#   task=smoke       auth + credits + DeepSeek price list + one number-validated
#                    completion on the "The Read" prompt (default)
#   task=usage       accounting only — key + credits. Spends nothing.
#   task=regulation  the REAL weekly regulation task (scripts/summarize_regulations.py)
#                    run against OpenRouter, with a Kimi A/B on the same section
#
# The regulation mode needs NO code changes: src/news/kimi.py is an
# OpenAI-compatible client already parameterized by KIMI_API_URL / KIMI_MODEL /
# KIMI_API_KEY, so pointing those three at OpenRouter swaps the provider while
# keeping the production prompt, context builder, retries and guards identical.
# That is the whole point — a bench with its own prompt would measure the bench.
#
# READ-ONLY on production: it pulls the R2 snapshot but never uploads one, and
# never runs push_to_d1.py. The briefing it generates lands only in the runner's
# ephemeral SQLite. Hence no `bddk-pipeline` concurrency group — nothing to lock.
#
# Scratch lane — delete this workflow and scripts/scratch_test_openrouter.py
# once the OpenRouter question is settled.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which probe to run"
        type: choice
        options: [smoke, usage, regulation, unit, freelist, vision, cells]
        default: smoke
      model_id:
        description: "Model to test (default: auto-pick cheapest paid deepseek / v4-pro for regulation)"
        required: false
        default: ""
      category:
        # Sentinel rather than "" — `gh workflow run -f category=` sends an empty
        # value, which GitHub replaces with this default, so blank silently meant
        # "one section" and quietly benched the wrong thing.
        description: "regulation only — section name, or ALL for the full five-section weekly run"
        required: false
        default: "Monetary Policy Stance"
      kimi_baseline:
        description: "regulation only — also run the same section on the incumbent (Kimi) for A/B"
        type: boolean
        required: false
        default: true
      telegram:
        description: "regulation only — also post the bench output to Telegram (labelled as a bench)"
        type: boolean
        required: false
        default: false
      provider:
        description: "regulation only — pin the OpenRouter upstream (e.g. Baidu). Blank = unpinned routing."
        required: false
        default: "Baidu"
      variants:
        description: >-
          unit only — comma-separated prompt/decoding variants to sweep
          (v0_baseline,v1_schema,v2_nothink,v3_effort_none,v4_schema_nothink,v5_all).
          Blank runs a single pass on the default settings.
        required: false
        default: ""
      sample:
        description: >-
          unit only — random-sample N filings from ALL of R2 history instead of
          the fixed 2026 corpus. 0 keeps the fixed corpus. Tests whether the
          detector generalises beyond the two quarters it was written against.
        required: false
        default: "0"
      seed:
        description: "unit only, with sample — sampling seed (change it to draw a different sample)"
        required: false
        default: "1729"
      llm_check:
        description: >-
          unit only, with sample — LLM-check this many sampled filings (every
          regex oddity first, then a random slice). 0 = regex only, spends nothing.
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
      MODEL_ID: ${{ inputs.model_id }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps (smoke/usage)
        if: inputs.task == 'smoke' || inputs.task == 'usage'
        run: pip install requests

      - name: Probe OpenRouter
        if: inputs.task == 'smoke' || inputs.task == 'usage'
        run: python scripts/scratch_test_openrouter.py ${{ inputs.task == 'usage' && '--usage' || '' }}

      # ---------------- unit-detection bench ----------------
      # Can an LLM read a filing's reporting unit as well as a regex can? The
      # 2026Q2 THOUSAND->MILLION switch is invisible to every validator we have,
      # so the unit must be read off the filing itself. The model returns a LABEL
      # from a closed set, never a figure — "no LLM sets a number" still holds.
      #
      # Needs R2 (the PDFs) but writes nothing back, and never touches D1.

      - name: Install deps (unit/freelist/vision)
        if: inputs.task == 'unit' || inputs.task == 'freelist' || inputs.task == 'vision' || inputs.task == 'cells'
        run: pip install requests boto3 pymupdf

      - name: List free + nemotron models
        if: inputs.task == 'freelist'
        run: python scripts/scratch_bench_unit_detection.py --list-free

      - name: Bench unit detection (regex vs LLM)
        if: inputs.task == 'unit'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Free NVIDIA endpoints return ResourceExhausted under load, which a
          # sweep would otherwise score as the model being wrong.
          BENCH_DELAY: "2"
        # `provider` is deliberately NOT forwarded: its default (Baidu) is the
        # regulation task's pinned upstream and would not serve the model this
        # bench picks. Unpinned routing is right for a one-off classification.
        run: >
          python scripts/scratch_bench_unit_detection.py
          ${{ inputs.model_id != '' && format('--model {0}', inputs.model_id) || '' }}
          ${{ inputs.variants != '' && format('--variants {0}', inputs.variants) || '' }}
          ${{ inputs.sample != '0' && format('--sample {0}', inputs.sample) || '' }}
          ${{ inputs.llm_check != '0' && format('--llm-check {0}', inputs.llm_check) || '' }}
          ${{ inputs.seed != '' && format('--seed {0}', inputs.seed) || '' }}

      - name: Upload bench result
        if: inputs.task == 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: bench-unit-detection
          path: bench_unit_detection.json
          if-no-files-found: warn

      # ---------------- vision-extraction bench ----------------
      # The 59 statements in data/manual_statements.json were typed in BY HAND
      # because the page is drawn, not typed — fitz has nothing to read. They are
      # the only part of this pipeline whose cost is a person's afternoon, which
      # makes them the one place an LLM could add capability instead of
      # duplicating it. Scored against the human transcript.
      #
      # ⚠️ This bench DOES ask a model for figures, which production forbids.
      # Nothing it returns is written anywhere; the comparison IS the output.

      - name: Bench vision extraction (LLM vs hand transcription)
        if: inputs.task == 'vision'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BENCH_DELAY: "2"
        run: >
          python scripts/scratch_bench_vision_extract.py
          ${{ inputs.model_id != '' && format('--model {0}', inputs.model_id) || '' }}
          ${{ inputs.sample != '0' && format('--limit {0}', inputs.sample) || '' }}

      - name: Upload vision bench result
        if: inputs.task == 'vision'
        uses: actions/upload-artifact@v4
        with:
          name: bench-vision-extract
          path: bench_vision_extract.json
          if-no-files-found: warn

      # ---------------- text-cell repair bench ----------------
      # 416 of the 457 hand corrections in data/audit_overrides.json are OUTSIDE
      # the balance sheet, and unlike the hand-transcribed statements those pages
      # DO have a text layer — fitz read them fine, the anchor logic put the
      # number in the wrong place. So this asks a text model to re-read text we
      # already have, which is a much easier problem than the vision bench.
      #
      # Balance-sheet lanes are excluded: the regex path is fine there.
      # Runs a CONTROL set too — a model that repairs 60% of broken cells while
      # breaking the good ones is worse than useless.

      - name: Fetch audit snapshot from R2 (read-only — never uploaded back)
        # The control set is drawn from stored, validated cells, so this bench
        # needs the snapshot. Pulled, never pushed.
        if: inputs.task == 'cells'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import gzip, shutil, pathlib
          from src.audit_reports import r2_storage
          gz = pathlib.Path("data/bank_audit.db.gz")
          db = pathlib.Path("data/bank_audit.db")
          gz.parent.mkdir(parents=True, exist_ok=True)
          if not r2_storage.exists("state/bank_audit.db.gz"):
              raise SystemExit("No audit snapshot in R2 — cannot build the control set.")
          size = r2_storage.download_to("state/bank_audit.db.gz", gz)
          print(f"Pulled state/bank_audit.db.gz from R2 ({size/1e6:.1f} MB)")
          with gzip.open(gz, "rb") as s, open(db, "wb") as d:
              shutil.copyfileobj(s, d)
          print(f"Decompressed to {db.stat().st_size/1e6:.1f} MB")
          PY

      - name: Bench text-cell repair (LLM vs manual corrections)
        if: inputs.task == 'cells'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The free NVIDIA endpoint returned "ResourceExhausted: Worker local
          # total request limit reached (32/32)" mid-sweep at 2s.
          BENCH_DELAY: "4"
        run: >
          python scripts/scratch_bench_text_cells.py
          ${{ inputs.model_id != '' && format('--model {0}', inputs.model_id) || '' }}
          ${{ inputs.sample != '0' && format('--repair {0} --control {0}', inputs.sample) || '' }}
          ${{ inputs.llm_check != '0' && format('--fields {0}', inputs.llm_check) || '' }}
          ${{ inputs.variants != '' && format('--fieldrepair {0}', inputs.variants) || '' }}
          ${{ inputs.kimi_baseline && '--prose' || '' }}

      - name: Upload cells bench result
        if: inputs.task == 'cells'
        uses: actions/upload-artifact@v4
        with:
          name: bench-text-cells
          path: bench_text_cells.json
          if-no-files-found: warn

      # ---------------- regulation task ----------------

      - name: Install deps (regulation)
        if: inputs.task == 'regulation'
        run: pip install -r requirements.txt

      - name: Fetch SQLite snapshot from R2 (read-only — never uploaded back)
        if: inputs.task == 'regulation'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import gzip, shutil, pathlib
          from src.audit_reports import r2_storage
          gz, db = pathlib.Path("data/bddk_data.db.gz"), pathlib.Path("data/bddk_data.db")
          gz.parent.mkdir(parents=True, exist_ok=True)
          if not r2_storage.exists("state/bddk_data.db.gz"):
              raise SystemExit("No R2 snapshot — cannot run the regulation task.")
          size = r2_storage.download_to("state/bddk_data.db.gz", gz)
          print(f"Pulled state/bddk_data.db.gz from R2 ({size/1e6:.1f} MB)")
          with gzip.open(gz, "rb") as s, open(db, "wb") as d:
              shutil.copyfileobj(s, d)
          print(f"Decompressed to {db.stat().st_size/1e6:.1f} MB")
          PY

      - name: Regulation section via OpenRouter (DeepSeek)
        if: inputs.task == 'regulation'
        env:
          # The three env vars kimi.py already reads — repointed, not rewritten.
          KIMI_API_KEY: ${{ secrets.OPEN_ROUTER_API }}
          KIMI_API_URL: https://openrouter.ai/api/v1/chat/completions
          KIMI_MODEL: ${{ inputs.model_id != '' && inputs.model_id || 'deepseek/deepseek-v4-pro' }}
          # Post the bench output too, but labelled — it has the same shape as the
          # live weekly briefing and must never be mistaken for what /regulation shows.
          TELEGRAM_BOT_TOKEN: ${{ inputs.telegram && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram && secrets.TELEGRAM_CHAT_ID || '' }}
          BRIEFING_LABEL: "🧪 BENCH — NOT the live briefing. /regulation is unchanged."
          # Pin the upstream. Baidu Qianfan: best latency (0.57s) AND best throughput
          # (73 tps) of all 18 endpoints, 100% uptime on both windows, fp8 not fp4,
          # ~4th cheapest — nothing trades off. allow_fallbacks stays false so a bad
          # name or an outage fails loudly instead of silently drawing another
          # provider, which is what made every earlier measurement noise.
          LLM_PROVIDER_ORDER: ${{ inputs.provider }}
          LLM_ALLOW_FALLBACKS: "false"
        run: |
          echo "== provider: OpenRouter / $KIMI_MODEL =="
          CAT='${{ inputs.category }}'
          if [ "$CAT" = "ALL" ]; then
            time python scripts/summarize_regulations.py --force
          else
            time python scripts/summarize_regulations.py --only-category "$CAT" --force
          fi
          python scripts/scratch_dump_briefing.py "OpenRouter / $KIMI_MODEL"
          python scripts/check_briefing_facts.py

      - name: Same section on the incumbent (Kimi) for A/B
        if: inputs.task == 'regulation' && inputs.kimi_baseline
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ inputs.telegram && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram && secrets.TELEGRAM_CHAT_ID || '' }}
          BRIEFING_LABEL: "🧪 BENCH (Kimi A/B) — NOT the live briefing."
        run: |
          echo "== provider: Kimi (incumbent) =="
          CAT='${{ inputs.category }}'
          if [ "$CAT" = "ALL" ]; then
            time python scripts/summarize_regulations.py --force
          else
            time python scripts/summarize_regulations.py --only-category "$CAT" --force
          fi
          python scripts/scratch_dump_briefing.py "Kimi (incumbent)"
