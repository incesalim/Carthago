name: Deploy Cloudflare Workers dashboard
run-name: Release ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

# Build the exact checked commit, then publish under release + audit locks.
# Manual releases use the same exact-SHA checks; rollback must explicitly name
# a previously successful verified release and retains the additive schema.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact checked SHA (empty = selected ref's commit)"
        type: string
        default: ""
      rollback:
        description: "Explicit rollback to a previously successful verified release"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: carthago-production-release
  queue: max
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

jobs:
  deploy:
    # Green CI on a push to master, or a hand-triggered run. `workflow_run` also
    # fires for CI runs on pull requests and for failed/cancelled runs — neither
    # should reach production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    concurrency:
      group: bddk-audit
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # A workflow_run job checks out the DEFAULT branch unless told
          # otherwise — deploy the exact commit CI went green on, not whatever
          # master points at by the time this starts.
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          # Must match ci.yml: npm 10 (Node 22) cannot `npm ci` a lockfile npm 11
          # wrote — see the note there. The deploy job runs the same install.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the checked SHA before any production write
        run: |
          npx opennextjs-cloudflare build
          echo "$RELEASE_SHA" > .open-next/release-sha.txt

      - name: Check exact release inside publication locks
        id: eligible
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK: ${{ inputs.rollback || false }}
        run: |
          args=(--sha "$RELEASE_SHA")
          if [ "$ROLLBACK" = "true" ]; then args+=(--rollback); fi
          python scripts/check_release.py "${args[@]}"

      - name: Reconcile known additive schema changes
        if: steps.eligible.outputs.eligible == 'true' && !inputs.rollback
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python scripts/reconcile_schema.py --apply

      - name: Apply versioned D1 schema migrations
        if: steps.eligible.outputs.eligible == 'true' && !inputs.rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply bddk-data --remote

      - name: Deploy the verified artifact
        if: steps.eligible.outputs.eligible == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(cat .open-next/release-sha.txt)" = "$RELEASE_SHA"
          npx opennextjs-cloudflare deploy

      - name: Check deployed pages and APIs
        if: steps.eligible.outputs.eligible == 'true'
        working-directory: .
        run: python scripts/check_release_smoke.py
