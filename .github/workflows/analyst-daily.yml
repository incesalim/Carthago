name: Analyst signals + memos

# The automated analyst layer (docs/knowledge/2026-08-04-analyst-build-plan.md):
# pull the audit snapshot from R2, run the deterministic detectors
# (scripts/analyst/detect.py — no LLM, no network beyond R2), then generate
# grounded analyst memos for the requested banks with the free-model chain
# (web/scripts/analyst-run.ts --memo → prompt → LLM → figure guard).
#
# DISPATCH-ONLY (state as of 2026-08-07 — the 2026-08-01 write freeze that
# originally forced this has since lifted):
#   - No schedule. The intended cadence is daily 07:00 UTC (after
#     refresh-news-daily, before European open):
#       # schedule:
#       #   - cron: "0 7 * * *"
#     Nothing blocks turning that on now; it is a decision nobody has taken.
#     Note a new workflow is born ENABLED and `gh workflow disable` leaves no
#     trace in git — shipping dispatch-only is what kept this lane inert (the
#     refresh-transcripts-weekly.yml precedent).
#   - A D1 push step DOES exist (see "Push analyst tables to Cloudflare D1"
#     below), gated on the `push` input and OFF by default. Migration
#     0037_analyst_signals.sql is APPLIED: analyst_signals (455 rows),
#     analyst_basis_metadata (1,050) and analyst_notes (2) are live in D1.
#     Without `push`, signals + basis metadata + memos still leave as run
#     artifacts only.
#
# Everything model-touching runs HERE because the LLM keys are CI secrets by
# design (no local keys exist), and batch generation belongs in Actions like
# every other lane.
on:
  workflow_dispatch:
    inputs:
      banks:
        description: "Tickers to write memos for (comma-separated). CALIBRATE = the ALBRK+SKBNK pair the hand memos cover. NONE = detectors only."
        type: string
        default: "CALIBRATE"
      period:
        description: "Quarter to analyse (YYYYQn)."
        type: string
        default: "2026Q1"
      kind:
        description: "Consolidation basis for the memos."
        type: choice
        options: [unconsolidated, consolidated]
        default: unconsolidated
      force_regen:
        description: "Regenerate memos even when the data hash is unchanged."
        type: boolean
        default: false
      push:
        description: "Push analyst_signals + analyst_basis_metadata to D1. Off by default."
        type: boolean
        default: false

permissions:
  contents: read

# Reads the audit snapshot — never race the extraction lane.
concurrency:
  group: bddk-audit
  cancel-in-progress: false

jobs:
  analyst:
    name: Detectors → memos (artifacts only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal Python deps
        # The detectors are stdlib-only by design; boto3 is for the R2 pull.
        # Installing all of requirements.txt (fitz, pandas, …) here would be
        # minutes of setup for code that never imports them.
        run: pip install boto3

      - name: Fetch snapshots from R2 (audit + bulletin)
        run: |
          python - <<'PY'
          import gzip, shutil, pathlib, sys
          from src.audit_reports import r2_storage
          for key, dest in (("state/bank_audit.db.gz", "data/bank_audit.db"),
                            ("state/bddk_data.db.gz", "data/bddk_data.db")):
              gz = pathlib.Path(dest + ".gz")
              db = pathlib.Path(dest)
              gz.parent.mkdir(parents=True, exist_ok=True)
              if not r2_storage.exists(key):
                  # The audit snapshot is required; the bulletin one only feeds
                  # macro/ownership colour — a memo without it still stands.
                  if "bank_audit" in key:
                      sys.exit(f"required snapshot missing in R2: {key}")
                  print(f"optional snapshot missing: {key} — macro sections will read as gaps")
                  continue
              size = r2_storage.download_to(key, gz)
              with gzip.open(gz, "rb") as s, open(db, "wb") as d:
                  shutil.copyfileobj(s, d)
              print(f"{key}: {size/1e6:.1f} MB → {db} ({db.stat().st_size/1e6:.1f} MB)")
          PY

      - name: Pull analyst staging state from R2 (memo hashes — regeneration gate)
        # data/analyst.db persists ACROSS runs via R2 so a memo regenerates
        # only when its bank-side data hash changed. Absent on first run: fine.
        run: |
          python - <<'PY'
          import gzip, shutil, pathlib
          from src.audit_reports import r2_storage
          key, dest = "state/analyst.db.gz", pathlib.Path("data/analyst.db")
          if r2_storage.exists(key):
              gz = pathlib.Path(str(dest) + ".gz")
              r2_storage.download_to(key, gz)
              with gzip.open(gz, "rb") as s, open(dest, "wb") as d:
                  shutil.copyfileobj(s, d)
              print(f"pulled {key} ({dest.stat().st_size/1e6:.1f} MB)")
          else:
              print("no analyst state in R2 yet — first run")
          PY

      - name: Run detectors (stage signals + basis metadata)
        run: python scripts/analyst/detect.py --db data/bank_audit.db --stage

      - name: Alert on critical signals
        # Informational only — a unit switch or ~1000× cross-period break is
        # exactly what someone should hear about the day it lands.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, subprocess, sys
          crit = [json.loads(l) for l in open("data/analyst_signals.jsonl", encoding="utf-8")]
          crit = [s for s in crit if s["severity"] == "critical"]
          if crit:
              names = ", ".join(sorted({f"{s['bank_ticker']} {s['period']}" for s in crit}))
              subprocess.run([sys.executable, "scripts/notify.py",
                              f"🚨 analyst: {len(crit)} CRITICAL signal(s) — {names}"], check=False)
          else:
              print("no critical signals")
          PY

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        if: inputs.banks != 'NONE'
        working-directory: web
        run: npm ci

      - name: Generate memos (LLM behind the figure guard)
        if: inputs.banks != 'NONE'
        working-directory: web
        env:
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          # Forwarded via env, never interpolated — a dispatch input must not
          # be able to inject shell.
          BANKS: ${{ inputs.banks }}
          PERIOD: ${{ inputs.period }}
          KIND: ${{ inputs.kind }}
          FORCE: ${{ inputs.force_regen && '--force' || '' }}
        run: |
          [ "$BANKS" = "CALIBRATE" ] && BANKS="ALBRK,SKBNK"
          if ! printf '%s' "$PERIOD" | grep -Eq '^[0-9]{4}Q[1-4]$'; then
            echo "bad period input: $PERIOD" >&2; exit 2
          fi
          fail=0
          IFS=',' read -ra TICKERS <<< "$BANKS"
          for t in "${TICKERS[@]}"; do
            t="$(printf '%s' "$t" | tr -cd 'A-Z')"
            [ -z "$t" ] && continue
            echo "── memo: $t $PERIOD $KIND"
            npx tsx scripts/analyst-run.ts --bank "$t" --period "$PERIOD" --kind "$KIND" \
              --memo --store $FORCE --out "../data/analyst_memo_${t}_${PERIOD}_${KIND}.json" || fail=1
            npx tsx scripts/analyst-run.ts --bank "$t" --period "$PERIOD" --kind "$KIND" \
              --sections --out "../data/analyst_sections_${t}_${PERIOD}_${KIND}.json"
          done
          # A memo that failed its fact-check is a result to READ, not a green run.
          exit $fail

      - name: Score reports (informational — the guard already gates)
        if: always()
        run: python scripts/analyst/score_reports.py "data/analyst_memo_*.json"

      # Off by default. The three analyst tables are registered as _FULL_REBUILD
      # in push_to_d1: detect.py derives them wholesale from the audit corpus on
      # every run, so there is no "recent row" to window on, and a signal that
      # stopped firing has to DISAPPEAR from D1 rather than linger. They are tiny
      # (455 + 1,050 rows), and the content hash makes an unchanged re-run free —
      # note `fired_at` is excluded from that hash, because detect.py omits the
      # column on INSERT and it therefore takes a fresh CURRENT_TIMESTAMP every
      # run even when the detector found exactly what it found yesterday.
      # `analyst_notes` is empty today; push_to_d1 refuses to emit a bare DELETE
      # for an empty full-rebuild table, so this cannot wipe it in D1.
      - name: Push analyst tables to Cloudflare D1
        if: ${{ inputs.push }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          python scripts/push_to_d1.py --db data/analyst.db
          --only-tables analyst_signals,analyst_basis_metadata,analyst_notes

      - name: Upload analyst staging state to R2
        if: always()
        run: |
          python - <<'PY'
          import gzip, pathlib, shutil
          from src.audit_reports import r2_storage
          db = pathlib.Path("data/analyst.db")
          if not db.exists():
              print("no analyst.db to upload")
              raise SystemExit(0)
          gz = pathlib.Path("data/analyst.db.gz")
          with open(db, "rb") as s, gzip.open(gz, "wb", compresslevel=6) as d:
              shutil.copyfileobj(s, d)
          size = r2_storage.upload_file(gz, "state/analyst.db.gz")
          print(f"uploaded state/analyst.db.gz ({size/1e6:.2f} MB)")
          PY

      - name: Upload artifacts (signals + basis + memos + sections)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analyst-${{ inputs.period }}-${{ github.run_id }}
          path: |
            data/analyst_signals.jsonl
            data/analyst_basis_metadata.jsonl
            data/analyst_memo_*.json
            data/analyst_sections_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/notify.py "❌ ${{ github.workflow }} failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
