name: CI

# Quality gates on every PR (and master push). Free: public-repo Actions.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    name: Python — ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lint/test tools
        # Still not the full requirements.txt — selenium/boto3/sqlalchemy back
        # lanes with no unit tests, and installing them only slows the job down.
        #
        # But pymupdf (fitz) + pandas are NOT optional: 13 test files
        # pytest.importorskip on them, so without them CI silently skipped every
        # extractor test — the largest subsystem in the repo — and reported green.
        # (Measured: 308 passed / 13 skipped without them; 394 passed / 0 skipped
        # with them. 86 tests had never run in CI.) None of those tests opens a
        # real PDF or touches the network — they build synthetic rows in-process —
        # and both ship prebuilt wheels, so the job stays fast. The extractors are
        # fitz-only (pdfplumber removed 2026-07-15).
        #
        # python-dotenv joined for the same reason (2026-07-27): src.scrapers.
        # evds_client does `from dotenv import load_dotenv` at import time, so
        # without it tests/test_d1_write_budget.py errors on collection — and
        # the alternative, an importorskip, would have made a test that guards a
        # ~17M-rows/month D1 billing regression silently decorative. Tiny, pure
        # Python, already in requirements.txt.
        run: pip install ruff pytest lxml requests pymupdf pandas python-dotenv
      - name: Ruff (lint)
        run: ruff check .
      - name: Pipeline graph sync
        # /pipeline topology (web/app/lib/pipeline-graph.ts) must reference every
        # .github/workflows/*.yml and vice versa. Stdlib-only, no extra deps.
        run: python scripts/check_pipeline_graph_sync.py
      - name: Docs sync
        # docs/OPERATIONS.md must name every workflow and every secrets./vars. a
        # workflow reads; every CloudflareEnv key must be documented somewhere.
        # An undocumented secret is a lane that dies silently on re-provision.
        # Stdlib-only (regexes the YAML as text — no PyYAML in this job).
        run: python scripts/check_docs_sync.py
      - name: Schema naming
        # New D1 migrations (>= 0022) must follow docs/SCHEMA_CONVENTIONS.md
        # (bank_ticker/amount_fc/snake_case/no reserved words/unique number).
        # Stdlib-only. Existing tables are grandfathered.
        run: python scripts/check_schema_naming.py
      - name: No pdfplumber
        # PDF extraction is fitz (PyMuPDF) only (pdfplumber removed 2026-07-15).
        # Blocks any `import pdfplumber` creeping back into src/scripts/tests, or
        # pdfplumber re-entering requirements.txt / this pip install. Stdlib-only.
        run: python scripts/check_no_pdfplumber.py
      - name: Calendar freshness
        # The Ahead blocks are derived, except TCMB's MPC dates — nothing scrapes
        # that calendar, so it is transcribed by hand in web/app/lib/ahead.ts.
        # Fails once it has under 90 days of runway, so it cannot run out the way
        # the hand-typed schedules did. Also ages out the BBVA baseline.
        run: python scripts/check_calendar_fresh.py
      - name: Contrast (text legibility)
        # Every colour used as TEXT must clear WCAG AA 4.5:1 on every surface it
        # sits on, in BOTH themes — and chart-theme.ts's tick-label colours must
        # equal the text tokens they copy. `--faint` shipped at 2.43:1 under
        # 8-10px type across 210 call sites; contrast is arithmetic nobody re-runs
        # after nudging a hex by eye. Stdlib-only.
        run: python scripts/check_contrast.py
      - name: Prose claims
        # A sentence asserting a direction, a level or a ranking must be computed
        # from the series it sits next to — or it lies the moment the data turns.
        # Catches a hardcoded sign, an asserting title= literal, a hardcoded bank
        # count. Escape hatch: `prose-ok: <reason>` (none in force today).
        # Stdlib-only.
        run: python scripts/check_prose_claims.py
      - name: Pytest
        run: pytest

  web:
    name: Web — eslint + tsc + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 (npm 11), NOT 22 (npm 10) — `npm ci` validates the lockfile
          # against package.json, and npm 10 rejects a lockfile npm 11 wrote:
          # esbuild 0.28's platform packages carry a `libc` field and nest under
          # `node_modules/wrangler/node_modules/`, which npm 10 reads as
          # "Missing: esbuild@0.28.1 from lock file". Dependabot writes its
          # lockfiles with npm 11, so this pin silently made EVERY web-deps PR
          # unmergeable (#90, #92 both died here, three weeks apart, looking like
          # a stale-lockfile problem that a rebase would fix — it wasn't).
          # Keep this in step with deploy-cloudflare.yml and with whatever npm
          # writes web/package-lock.json.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test

  mobile:
    name: Mobile — eslint + tsc + tokens + bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 for the same lockfile reason as the web job — npm 10 rejects
          # a lockfile npm 11 wrote. Keep the two jobs on the same major.
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Type-check
        run: npx tsc --noEmit
      - name: Theme tokens in sync with globals.css
        # mobile/src/theme/tokens.ts is a hand-copy of web/app/globals.css —
        # React Native can't read a CSS custom property. Two copies of a colour
        # system drift silently, so this re-reads the CSS and diffs it.
        run: npm run check:tokens
      - name: Metro bundle (iOS + Android)
        # The one check that proves the app actually builds. tsc is happy with a
        # module Metro can't resolve (a native-only import, a bad asset path, a
        # route file in the wrong place), and those failures otherwise surface
        # for the first time on a developer's device — or in a store build.
        # No simulator, Xcode or Android SDK needed; this is the JS bundle only.
        #
        # BOTH platforms, not just one. Metro resolves `.ios.tsx` / `.android.tsx`
        # / `.native.tsx` suffixes per platform, and a native module can ship a
        # stub for one and not the other — so a bundle that builds for iOS is not
        # evidence the Android bundle does. This gate shipped iOS-only and was
        # the reason Android had never been verified at all.
        run: |
          npx expo export --platform ios --output-dir .expo-export-ios
          npx expo export --platform android --output-dir .expo-export-android
