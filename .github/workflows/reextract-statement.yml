name: Re-extract one statement

# Targeted single-statement re-extract via scripts/reextract_statement.py: pull
# snapshot → re-extract ONLY the named statement for the selected partitions →
# inline-validate → push that table + bank_audit_validation to D1 → re-upload the
# snapshot → refresh the coverage matrix. The non-destructive guards leave passing
# partitions untouched, roll back candidates that remain invalid, and skip statement
# rows whose facts did not change. This cannot regress correct data — including the
# frozen BS/P&L — or restamp a no-op repair. Manual only.
#
# only_failing selects partitions whose full registry validation gate is not
# passing. That includes dependent results (both BS sides + cross-footing;
# credit_quality + derived stages), explicit failures, and non-conditional
# zero-pass rows. Conditional N/A rows are not treated as failures.
on:
  workflow_dispatch:
    inputs:
      statement:
        description: "Statement lane to re-extract (e.g. oci, equity_change)"
        type: string
        required: true
        default: "oci"
      banks:
        description: "Tickers (comma-separated) or ALL"
        type: string
        default: "ALL"
      periods:
        description: "Quarters (comma-separated YYYYQn, e.g. 2026Q1); blank = all"
        type: string
        default: ""
      partitions:
        description: "Exact BANK:YYYYQn:kind triples, comma-separated; intersects other filters"
        type: string
        default: ""
      kind:
        description: "Restrict to one kind (consolidated/unconsolidated); blank = both. Used by the /admin single-cell re-extract"
        type: string
        default: ""
      only_failing:
        description: "Only partitions NOT passing validation (failing OR empty) — efficient default; skips the proven-passing rest"
        type: boolean
        default: true
      force:
        description: "Overwrite even partitions whose full relationship gate passes. Use with --banks and turn only_failing OFF"
        type: boolean
        default: false
      require_passing:
        description: "Roll back any candidate unless every required relationship result passes"
        type: boolean
        default: true
      dry_run:
        description: "Pull the live snapshot and re-extract locally only; skip D1 and snapshot writes"
        type: boolean
        default: false

permissions:
  contents: read

# Share the audit lane so this can't race the weekly refresh / a backfill (same R2
# snapshot). One audit job at a time.
concurrency:
  group: bddk-audit
  cancel-in-progress: false

jobs:
  reextract:
    name: Re-extract statement → D1 + snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Node (for wrangler / D1 push)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Re-extract (→ inline-validate → push table + validation → snapshot)
        # Inputs forwarded via env (never interpolated into the command line) so a
        # dispatch input is one quoted argument and can't inject shell.
        env:
          STATEMENT: ${{ inputs.statement }}
          BANKS: ${{ inputs.banks }}
          PERIODS: ${{ inputs.periods }}
          PARTITIONS: ${{ inputs.partitions }}
          KIND: ${{ inputs.kind }}
          ONLY_FAILING: ${{ inputs.only_failing && '--only-failing' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          REQUIRE_PASSING: ${{ inputs.require_passing && '--require-passing' || '' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          args=(--statement "$STATEMENT" --banks "$BANKS" --pull-snapshot)
          [ -n "$PERIODS" ] && args+=(--periods "$PERIODS")
          [ -n "$PARTITIONS" ] && args+=(--partitions "$PARTITIONS")
          [ -n "$KIND" ] && args+=(--kind "$KIND")
          [ -n "$ONLY_FAILING" ] && args+=("$ONLY_FAILING")
          [ -n "$FORCE" ] && args+=("$FORCE")
          [ -n "$REQUIRE_PASSING" ] && args+=("$REQUIRE_PASSING")
          [ -n "$DRY" ] && args+=("$DRY")
          python scripts/reextract_statement.py "${args[@]}"

      - name: Refresh coverage matrix (/admin)
        if: ${{ !inputs.dry_run }}
        run: python scripts/sync_audit_expected.py --push

      - name: Audit data-quality check (alert-only)
        if: ${{ !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/check_audit_quality.py --db data/bank_audit.db --alert
